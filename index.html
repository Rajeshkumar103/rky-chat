<body>
<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script>

/* 🔊 RKY GROUP CALL SOUND SYSTEM */
let rkyCallAudioCtx = null;
let rkyCallSoundTimer = null;
let rkyCallSoundType = null;

function rkyGetCallAudio(){
  try{
    if(!rkyCallAudioCtx){
      rkyCallAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(rkyCallAudioCtx.state === "suspended"){
      rkyCallAudioCtx.resume().catch(()=>{});
    }
    return rkyCallAudioCtx;
  }catch(e){
    console.warn("Call audio unavailable:", e);
    return null;
  }
}

function rkyCallTone(freq, duration, volume=0.045){
  const ctx = rkyGetCallAudio();
  if(!ctx) return;

  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + duration + 0.03);
  }catch(e){}
}

function rkyPlayCallSound(type){
  rkyStopCallSound();

  rkyCallSoundType = type;

  const play = () => {
    if(rkyCallSoundType !== type) return;

    if(type === "outgoing"){
      rkyCallTone(620, .28, .045);
      setTimeout(()=>{
        if(rkyCallSoundType === type) rkyCallTone(740, .28, .045);
      }, 340);
    }

    if(type === "incoming"){
      rkyCallTone(880, .22, .055);
      setTimeout(()=>{
        if(rkyCallSoundType === type) rkyCallTone(660, .30, .055);
      }, 270);
    }

    if(type === "offline"){
      rkyCallTone(330, .18, .055);
      setTimeout(()=>{
        if(rkyCallSoundType === type) rkyCallTone(220, .30, .045);
      }, 220);
    }
  };

  play();

  rkyCallSoundTimer = setInterval(play, type === "offline" ? 1300 : 1800);
}

function rkyStopCallSound(){
  rkyCallSoundType = null;

  if(rkyCallSoundTimer){
    clearInterval(rkyCallSoundTimer);
    rkyCallSoundTimer = null;
  }
}

window.addEventListener("pagehide", rkyStopCallSound);
window.addEventListener("beforeunload", rkyStopCallSound);

let rkyGroupSocket = null;
let rkyGroupCallPeers = {};
let rkyGroupCallMode = null;
let rkyGroupCallStream = null;
let rkyActiveCallGroupId = null;

function initGroupCallSocket(){
  if(rkyGroupSocket) return rkyGroupSocket;

  if(typeof io !== "function"){
    console.error("Socket.IO client is not available");
    return null;
  }

  rkyGroupSocket = io();

  rkyGroupSocket.on("connect", () => {
    console.log(
      "Rky group-call socket connected:",
      rkyGroupSocket.id
    );
  });

  rkyGroupSocket.on("group-call-invite", data => {
    if(!data) return;

    const groupId = Number(data.groupId);
    const from = String(data.from || "").trim();
    const mode = data.mode === "video" ? "video" : "audio";

    if(!groupId || !from || from === currentUser){
      return;
    }

    console.log(
      "📲 Incoming group call:",
      from,
      "group:",
      groupId,
      "mode:",
      mode
    );

    window.rkyIncomingGroupCall = {
      groupId: groupId,
      from: from,
      mode: mode
    };

    rkyShowIncomingGroupCall(
      groupId,
      from,
      mode
    );
  });

  rkyGroupSocket.on("group-call-user-joined", async data => {
    if(!data) return;

    const groupId = Number(data.groupId);
    const username = String(data.username || "").trim();

    if(
      !groupId ||
      !username ||
      username === currentUser ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    try{
      const peer = rkyCreateGroupPeer(username);

      const offer = await peer.pc.createOffer();
      await peer.pc.setLocalDescription(offer);

      const eventName =
        rkyGroupCallMode === "video"
          ? "group-video-offer"
          : "group-audio-offer";

      rkyGroupSocket.emit(eventName, {
        groupId: groupId,
        from: currentUser,
        to: username,
        offer: offer
      });

      console.log("Offer sent to:", username);

    }catch(error){
      console.error(
        "Could not create group offer:",
        username,
        error
      );
    }
  });

  rkyGroupSocket.on("group-call-user-left", data => {
    if(!data) return;

    const username =
      String(data.username || "").trim();

    if(username){
      rkyRemoveGroupPeer(username);
    }
  });

  rkyGroupSocket.on("group-audio-offer", async data => {
    if(!data || rkyGroupCallMode !== "audio") return;

    const groupId = Number(data.groupId);
    const from = String(data.from || "").trim();

    if(
      !groupId ||
      !from ||
      from === currentUser ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    try{
      const peer = rkyCreateGroupPeer(from);

      await peer.pc.setRemoteDescription(
        new RTCSessionDescription(data.offer)
      );

      const answer =
        await peer.pc.createAnswer();

      await peer.pc.setLocalDescription(answer);

      rkyGroupSocket.emit("group-audio-answer", {
        groupId: groupId,
        from: currentUser,
        to: from,
        answer: answer
      });

    }catch(error){
      console.error(
        "Group audio offer error:",
        error
      );
    }
  });

  rkyGroupSocket.on("group-audio-answer", async data => {
    if(!data) return;

    const from =
      String(data.from || "").trim();

    const groupId =
      Number(data.groupId);

    if(
      !from ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    const peer =
      rkyGroupCallPeers[from];

    if(!peer) return;

    try{
      await peer.pc.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );
    }catch(error){
      console.error(
        "Group audio answer error:",
        error
      );
    }
  });

  rkyGroupSocket.on("group-audio-ice", async data => {
    if(!data) return;

    const from =
      String(data.from || "").trim();

    const groupId =
      Number(data.groupId);

    if(
      !from ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    const peer =
      rkyGroupCallPeers[from];

    if(!peer || !data.candidate) return;

    try{
      await peer.pc.addIceCandidate(
        new RTCIceCandidate(data.candidate)
      );
    }catch(error){
      console.warn(
        "Group audio ICE error:",
        error
      );
    }
  });

  rkyGroupSocket.on("group-video-offer", async data => {
    if(!data || rkyGroupCallMode !== "video") return;

    const groupId =
      Number(data.groupId);

    const from =
      String(data.from || "").trim();

    if(
      !groupId ||
      !from ||
      from === currentUser ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    try{
      const peer =
        rkyCreateGroupPeer(from);

      await peer.pc.setRemoteDescription(
        new RTCSessionDescription(data.offer)
      );

      const answer =
        await peer.pc.createAnswer();

      await peer.pc.setLocalDescription(answer);

      rkyGroupSocket.emit("group-video-answer", {
        groupId: groupId,
        from: currentUser,
        to: from,
        answer: answer
      });

    }catch(error){
      console.error(
        "Group video offer error:",
        error
      );
    }
  });

  rkyGroupSocket.on("group-video-answer", async data => {
    if(!data) return;

    const from =
      String(data.from || "").trim();

    const groupId =
      Number(data.groupId);

    if(
      !from ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    const peer =
      rkyGroupCallPeers[from];

    if(!peer) return;

    try{
      await peer.pc.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );
    }catch(error){
      console.error(
        "Group video answer error:",
        error
      );
    }
  });

  rkyGroupSocket.on("group-video-ice", async data => {
    if(!data) return;

    const from =
      String(data.from || "").trim();

    const groupId =
      Number(data.groupId);

    if(
      !from ||
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    const peer =
      rkyGroupCallPeers[from];

    if(!peer || !data.candidate) return;

    try{
      await peer.pc.addIceCandidate(
        new RTCIceCandidate(data.candidate)
      );
    }catch(error){
      console.warn(
        "Group video ICE error:",
        error
      );
    }
  });

  rkyGroupSocket.on("group-call-ended", data => {
    if(!data) return;

    const groupId =
      Number(data.groupId);

    if(
      groupId !== Number(rkyActiveCallGroupId)
    ){
      return;
    }

    console.log(
      "Group call ended by:",
      data.from
    );

    endGroupCall(false);
  });

  return rkyGroupSocket;
}

const rkyGroupIceServers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ]
};

async function rkyGetGroupMembers(groupId){
  const r = await fetch(
    "/api/groups/" + groupId + "/members?username=" +
    encodeURIComponent(currentUser)
  );

  const data = await r.json();

  if(!r.ok || !data.success){
    throw new Error(data.message || "Could not load group members");
  }

  return Array.isArray(data.members) ? data.members : [];
}

function rkyCreateGroupPeer(username){
  if(rkyGroupCallPeers[username]){
    return rkyGroupCallPeers[username];
  }

  const pc = new RTCPeerConnection(rkyGroupIceServers);

  rkyGroupCallPeers[username] = {
    pc: pc,
    username: username
  };

  if(rkyGroupCallStream){
    rkyGroupCallStream.getTracks().forEach(track => {
      pc.addTrack(track, rkyGroupCallStream);
    });
  }

  pc.onicecandidate = event => {
    if(!event.candidate || !rkyGroupSocket) return;

    const eventName =
      rkyGroupCallMode === "video"
        ? "group-video-ice"
        : "group-audio-ice";

    rkyGroupSocket.emit(eventName, {
      groupId: rkyActiveCallGroupId,
      from: currentUser,
      to: username,
      candidate: event.candidate
    });
  };

  pc.ontrack = event => {
    rkyAttachGroupRemoteStream(username, event.streams[0]);
  };

  pc.onconnectionstatechange = () => {
    console.log(
      "Group peer:",
      username,
      pc.connectionState
    );

    if(
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ){
      rkyRemoveGroupPeer(username);
    }
  };

  return rkyGroupCallPeers[username];
}

function rkyAttachGroupRemoteStream(username, stream){
  let box = document.getElementById(
    "rkyGroupRemote_" + CSS.escape(username)
  );

  if(!box){
    const container =
      document.getElementById("rkyGroupRemoteMedia");

    if(!container) return;

    box = document.createElement("div");
    box.className = "group-remote-tile";
    box.id = "rkyGroupRemote_" + username;

    const label = document.createElement("span");
    label.textContent = username;

    const media = document.createElement(
      rkyGroupCallMode === "video" ? "video" : "audio"
    );

    media.autoplay = true;
    media.playsInline = true;
    media.srcObject = stream;

    box.appendChild(media);
    box.appendChild(label);
    container.appendChild(box);
    return;
  }

  const media = box.querySelector("video,audio");

  if(media){
    media.srcObject = stream;
  }
}

function rkyRemoveGroupPeer(username){
  const entry = rkyGroupCallPeers[username];

  if(entry){
    try{
      entry.pc.close();
    }catch(e){}

    delete rkyGroupCallPeers[username];
  }

  const box = document.getElementById(
    "rkyGroupRemote_" + CSS.escape(username)
  );

  if(box) box.remove();
}

function rkyCloseAllGroupPeers(){
  Object.keys(rkyGroupCallPeers).forEach(
    rkyRemoveGroupPeer
  );

  rkyGroupCallPeers = {};
}


async function rkyStartGroupLocalStream(mode){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("Camera/microphone access is not supported");
  }

  const constraints =
    mode === "video"
      ? {
          audio:true,
          video:{
            facingMode:"user",
            width:{ideal:1280},
            height:{ideal:720}
          }
        }
      : {
          audio:true,
          video:false
        };

  const stream =
    await navigator.mediaDevices.getUserMedia(constraints);

  rkyGroupCallStream = stream;

  const container =
    document.getElementById("rkyGroupLocalMedia");

  if(container){
    container.innerHTML = "";

    if(mode === "video"){
      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      video.srcObject = stream;
      container.appendChild(video);
    }else{
      const label = document.createElement("div");
      label.textContent = "🎤 Microphone active";
      container.appendChild(label);
    }
  }

  return stream;
}

function rkyShowGroupCallOverlay(mode, groupId){
  const overlay =
    document.getElementById("rkyGroupCallOverlay");

  if(!overlay) return;

  overlay.hidden = false;

  const title =
    document.getElementById("rkyGroupCallTitle");

  const status =
    document.getElementById("rkyGroupCallStatus");

  if(title){
    title.textContent =
      mode === "video"
        ? "Group video call"
        : "Group voice call";
  }

  if(status){
    status.textContent =
      "Waiting for participants...";
  }

  rkyActiveCallGroupId = groupId;
  rkyGroupCallMode = mode;
}

async
function endGroupCall(){
  const groupId = rkyActiveCallGroupId;

  if(notify && rkyGroupSocket && groupId && currentUser){
    rkyGroupSocket.emit("group-call-leave", {
      groupId: groupId,
      username: currentUser
    });

    rkyGroupSocket.emit("group-call-end", {
      groupId: groupId,
      from: currentUser
    });
  }

  rkyCloseAllGroupPeers();

  if(rkyGroupCallStream){
    rkyGroupCallStream.getTracks().forEach(track => {
      try{
        track.stop();
      }catch(e){}
    });
  }

  rkyGroupCallStream = null;
  rkyActiveCallGroupId = null;
  rkyGroupCallMode = null;

  const overlay =
    document.getElementById("rkyGroupCallOverlay");

  if(overlay){
    overlay.hidden = true;
  }

  const local =
    document.getElementById("rkyGroupLocalMedia");

  if(local){
    local.innerHTML = "";
  }

  const remote =
    document.getElementById("rkyGroupRemoteMedia");

  if(remote){
    remote.innerHTML = "";
  }
}

function toggleGroupMute(){

  const track =
    rkyGroupCallStream.getAudioTracks()[0];

  if(!track) return;

  track.enabled = !track.enabled;

  const button =
    document.getElementById("rkyGroupMuteBtn");

  }
}

function toggleGroupCamera(){

  if(!rkyGroupCallStream) return;

  const track =
    rkyGroupCallStream.getVideoTracks()[0];

  if(!track) return;

  track.enabled = !track.enabled;

  const button =
    document.getElementById("rkyGroupCameraBtn");

  if(button){
    button.textContent =
      track.enabled ? "📹" : "🚫";
  }
}

function rkyShowIncomingGroupCall(groupId, from, mode){
  const box = document.getElementById("rkyIncomingGroupCall");

  if(!box) return;

  const name =
    document.getElementById("rkyIncomingGroupCallName");

  const type =

  };

    from,
    groupId,
    mode
  );
}

function rkyRejectIncomingGroupCall(){
  const box =
    document.getElementById("rkyIncomingGroupCall");

  if(box){
    box.classList.remove("show");
    box.hidden = true;
  }

  window.rkyIncomingGroupCall = null;

  console.log("❌ Incoming group call rejected");
}

async function rkyAcceptIncomingGroupCall(){
  rkyStopCallSound();
  const call = window.rkyIncomingGroupCall;

  if(!call || !call.groupId){
    return;
  }

  const groupId = Number(call.groupId);
  const mode =
    call.mode === "video"
      ? "video"
      : "audio";

  const box =
    document.getElementById("rkyIncomingGroupCall");

  if(box){
    box.classList.remove("show");
    box.hidden = true;
  }

  window.rkyIncomingGroupCall = null;

  console.log(
    "✅ Accepting incoming group call:",
    groupId,
    mode
  );

  try{
    if(typeof openGroup === "function"){
      await openGroup(groupId);
    }

    if(mode === "video"){
      await startGroupVideoCall();
    }else{
      await startGroupVoiceCall();
    }

  }catch(error){
    console.error(
      "Accept group call failed:",
      error
    );
  }
}

async function startGroupVoiceCall(){
  const screen = document.getElementById("groupChatScreen");
  const groupId = screen && Number(screen.dataset.groupId);

  if(!groupId || !currentUser) return;

  try{
    const socket = initGroupCallSocket();
    if(!socket) return;

    rkyShowGroupCallOverlay("audio", groupId);
    rkyPlayCallSound("outgoing");
    const cameraBtn = document.getElementById("rkyGroupCameraBtn");
    if(cameraBtn){
      cameraBtn.disabled = true;
      cameraBtn.style.opacity = "0.45";
    }

    await rkyStartGroupLocalStream("audio");

    socket.emit("group-call-check-users", {
      groupId: groupId,
      username: currentUser
    });

    socket.emit("group-call-join", {
      groupId: groupId,
      username: currentUser,
      mode: "audio"
    });

    console.log(
      "Started group voice call:",
      groupId,
      currentUser
    );

  }catch(error){
    console.error("Group voice call:", error);
    alert(
      "Microphone access failed. Please allow microphone permission."
    );

    endGroupCall();
  }
}

async function startGroupVideoCall(){
  const screen = document.getElementById("groupChatScreen");
  const groupId = screen && Number(screen.dataset.groupId);

  if(!groupId || !currentUser) return;

  try{
    const socket = initGroupCallSocket();
    if(!socket) return;

    rkyShowGroupCallOverlay("video", groupId);
    rkyPlayCallSound("outgoing");
    const cameraBtn = document.getElementById("rkyGroupCameraBtn");
    if(cameraBtn){
      cameraBtn.disabled = false;
      cameraBtn.style.opacity = "1";
    }

    await rkyStartGroupLocalStream("video");

    socket.emit("group-call-check-users", {
      groupId: groupId,
      username: currentUser
    });

    socket.emit("group-call-join", {
      groupId: groupId,
      username: currentUser,
      mode: "video"
    });

    console.log(
      "Started group video call:",
      groupId,
      currentUser
    );

  }catch(error){
    console.error("Group video call:", error);
    alert(
      "Camera/microphone access failed. Please allow permissions."
    );

    endGroupCall();
  }
}

async function loadMessages(){
  const box=document.getElementById("chatMessages");

  try{

      "/api/messages/"+encodeURIComponent(currentUser)+"/"+
      encodeURIComponent(selectedFriend)+"?t="+Date.now()
    );

    const data=await r.json();

      box.innerHTML=`<div class="empty">No messages yet.<br>Say hello 👋</div>`;

async function sendMessage(event){
  event.preventDefault();

  const input=document.getElementById("messageInput");
  const message=input.value.trim();

  if(!message)return;

  input.disabled=true;

  try{
    const r=await fetch("/api/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        sender:currentUser,
        receiver:selectedFriend,
        message,
        reply_to:null
      })
    });

    const data=await r.json();

    if(!r.ok||data.success===false){
      throw new Error(data.message||"Message failed");
    }

    input.value="";
    await loadMessages();

  }catch(e){
    alert(e.message||"Message could not be sent");
  }finally{
    input.disabled=false;
    input.focus();
  }
}

function formatTime(value){
  if(!value)return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return "";
  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

async function createGroup(){
  if(!currentUser) return;

  if(!friendsData.length){
    alert("You need at least one friend to create a group.");
    return;
  }

  const name = prompt("Enter group name:");
  if(!name || !name.trim()) return;

  const list = friendsData
    .map((f, i) => {
      const username = typeof f === "string"
        ? f
        : (f.username || f.name || "");

      return username
        ? `${i + 1}. ${username}`
        : "";
    })
    .filter(Boolean)
    .join("\n");

  const choice = prompt(
    "Select friend number(s) separated by comma:\n\n" + list +
    "\n\nExample: 1,2"
  );

  if(!choice || !choice.trim()) return;

  const indexes = choice
    .split(",")
    .map(x => Number(x.trim()) - 1)
    .filter(x => Number.isInteger(x) && x >= 0 && x < friendsData.length);

  const selected = indexes.map(i => {
    const f = friendsData[i];
    return typeof f === "string"
      ? f
      : (f.username || f.name || "");
  }).filter(Boolean);

  const members = Array.from(new Set([currentUser, ...selected]));

  if(members.length < 2){
    alert("Select at least one friend.");
    return;
  }

  try{
    const r = await fetch("/api/groups", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        name: name.trim(),
        created_by: currentUser,
        members: members
      })
    });

    const data = await r.json();

    if(!r.ok || !data.success){
      alert(data.message || "Could not create group");
      return;
    }

    await loadGroups();

    if(data.group && data.group.id){
      openGroup(data.group.id);
    }

  }catch(e){
    console.error("createGroup:", e);
    alert("Could not create group");
  }
}


function openGroup(groupId){
  const old = document.getElementById("groupChatScreen");
  if(old) old.remove();

  const screen = document.createElement("div");
  screen.id = "groupChatScreen";
  screen.className = "chat";

  screen.innerHTML = `
    <div class="chat-header">
      <button class="back" onclick="closeGroup()">‹</button>
      <div>
        <strong id="groupChatTitle">Group</strong>
        <small>Group chat</small>
      </div>

      <div class="group-call-actions">
        <button type="button" title="Group voice call" onclick="startGroupVoiceCall()">☎</button>
        <button type="button" title="Group video call" onclick="startGroupVideoCall()">▣</button>
      </div>
    </div>

    <div id="groupMessages" class="messages">
      <div class="empty">Loading messages...</div>
    </div>

    <form class="composer" onsubmit="sendGroupMessage(event)">
      <input
        id="groupMessageInput"
        autocomplete="off"
        placeholder="Type a message..."
      >
      <button type="submit">➤</button>
    </form>
  `;

  document.body.appendChild(screen);

  screen.dataset.groupId = String(groupId);

  loadGroupInfo(groupId);
  loadGroupMessages(groupId);
}

function closeGroup(){
  const screen = document.getElementById("groupChatScreen");
  if(screen) screen.remove();
}

async function loadGroupInfo(groupId){
  try{
    const r = await fetch("/api/groups/" + groupId + "/members");
    const data = await r.json();

    if(data.success && Array.isArray(data.members)){
      const title = document.getElementById("groupChatTitle");
      if(title){
        title.textContent = "Group • " + data.members.length;
      }
    }
  }catch(e){
    console.error("loadGroupInfo:", e);
  }
}

async function loadGroupMessages(groupId){
  const box = document.getElementById("groupMessages");
  if(!box) return;

  try{
    const r = await fetch(
      "/api/groups/" + groupId + "/messages?username=" +
      encodeURIComponent(currentUser) + "&t=" + Date.now()
    );

    const data = await r.json();
    const messages = data.messages || [];

    if(!messages.length){
      box.innerHTML = '<div class="empty">No messages yet</div>';
      return;
    }

    box.innerHTML = messages.map(m => {
      const mine = m.sender === currentUser;

      return `
        <div class="message ${mine ? "mine" : "theirs"}">
          <div class="message-bubble">
            ${!mine ? `<small>${esc(m.sender || "")}</small>` : ""}
            <div>${esc(m.message || "")}</div>
            <time>${formatTime(m.time)}</time>
          </div>
        </div>
      `;
    }).join("");

    box.scrollTop = box.scrollHeight;

  }catch(e){
    console.error("loadGroupMessages:", e);
    box.innerHTML = '<div class="empty">Unable to load messages</div>';
  }
}

async function sendGroupMessage(event){
  event.preventDefault();

  const screen = document.getElementById("groupChatScreen");
  const input = document.getElementById("groupMessageInput");

  if(!screen || !input) return;

  const groupId = Number(screen.dataset.groupId);
  const text = input.value.trim();

  if(!groupId || !text || !currentUser) return;

  try{
    const r = await fetch("/api/groups/" + groupId + "/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        sender: currentUser,
        message: text
      })
    });

    const data = await r.json();

    if(!r.ok || !data.success){
      alert(data.message || "Message could not be sent");
      return;
    }

    input.value = "";
    await loadGroupMessages(groupId);

  }catch(e){
    console.error("sendGroupMessage:", e);
    alert("Message could not be sent");
  }
}

</script>
